[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-hedging-pricing-simulator"
version = "0.1.0"
description = "Differential-ML pricing core and deep hedging under transaction costs, benchmarked against classical quants."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Sousa" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
# QuantLib reference validation (SP1); not needed for the core package.
ql = ["QuantLib>=1.33"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]
# Interactive dashboard (app/dashboard.py).
app = ["streamlit>=1.37", "plotly>=5.22"]
# Conflicting torch builds: pick exactly one (see [tool.uv]).
cpu = ["torch>=2.2"]
gpu = ["torch>=2.7"]  # Blackwell (sm_120) needs cu128+

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "gpu" },
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]

[tool.ruff.lint.per-file-ignores]
# script-style sys.path insertion before imports
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
